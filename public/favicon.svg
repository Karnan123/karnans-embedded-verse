<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="planetGrad" x1="30%" y1="30%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#030712"/>
  <g transform="translate(256, 256)">
    <!-- Rings behind -->
    <ellipse rx="200" ry="50" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.35" transform="rotate(-20)"/>
    <ellipse rx="170" ry="42" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.2" transform="rotate(-20)"/>
    <!-- Planet -->
    <circle r="90" fill="url(#planetGrad)" filter="url(#glow)"/>
    <!-- Ring arc in front -->
    <path d="M -185,-28 A 200,50 0 0,1 185,-28" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.75" transform="rotate(-20)"/>
    <path d="M -157,-24 A 170,42 0 0,1 157,-24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.45" transform="rotate(-20)"/>
    <!-- Atmospheric highlight -->
    <circle r="80" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>
  </g>
</svg>
